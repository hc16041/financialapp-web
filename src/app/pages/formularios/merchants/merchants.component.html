<!-- KPIs de Comercios (SPEC-06 §4.5): el backend no expone activo/inactivo, solo total -->
<div class="row g-3 mb-3">
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Total comercios"
      [value]="totalMerchants()"
      icon="mdi mdi-store-outline"
      variant="primary"
      [loading]="loading()"
      [emptyLabel]="'Sin comercios'"
    ></app-kpi-card>
  </div>
</div>

<app-generic-table
  [title]="'Listado de Comercios'"
  [columns]="tableColumns"
  [excludedFields]="['isProcessed', 'creditCard', 'date']"
  [selectFields]="['creditCardId', 'type', 'merchantId', 'category']"
  [selectOptions]="selectOptions()"
  [requiredFields]="['id']"
  [readonlyFields]="['id']"
  [allowedActions]="['edit', 'process', 'deactivate', 'activate']"
  [data]="merchantsList"
  [showActions]="true"
  [searchEnabled]="true"
  [showNewRegister]="true"
  [showStatusFilter]="true"
  [entityDTO]="merchantsDTO"
  [hiddenColumns]="['id', 'isProcessed', 'creditCard']"
  (new)="onAddMerchant($event)"
>
</app-generic-table>
