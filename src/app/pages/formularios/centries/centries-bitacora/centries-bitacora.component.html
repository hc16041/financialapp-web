<!-- KPIs de Bitácora (SPEC-06 §4.6): conteos por tipo de archivo descargado -->
<div class="row g-3 mb-3">
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Total descargas"
      [value]="totalDescargas()"
      icon="mdi mdi-file-download-outline"
      variant="primary"
      [loading]="loading()"
      [emptyLabel]="'Sin registros'"
    ></app-kpi-card>
  </div>
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="XML"
      [value]="xmlDownloads()"
      icon="mdi mdi-xml"
      variant="info"
      [loading]="loading()"
      [emptyLabel]="'Sin registros'"
    ></app-kpi-card>
  </div>
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Excel"
      [value]="excelDownloads()"
      icon="mdi mdi-file-excel-outline"
      variant="success"
      [loading]="loading()"
      [emptyLabel]="'Sin registros'"
    ></app-kpi-card>
  </div>
</div>

<app-generic-table
  [title]="'Listado de Bitacora De Descargas'"
  [columns]="tableColumns"
  [data]="bitacoraList"
  [allowedActions]="['file']"
  [showActions]="true"
  [searchEnabled]="true"
  [showXmlDownload]="false"
  [showExcelDownload]="false"
  [hiddenColumns]="['text_archivo']"
  (fileDownload)="descargarArchivo($event)"
>
</app-generic-table>
