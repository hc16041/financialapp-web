<!-- KPIs de Cargos (SPEC-06 §4.6) -->
<div class="row g-3 mb-3">
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Total cargos"
      [value]="totalCargos()"
      icon="mdi mdi-briefcase-outline"
      variant="primary"
      [loading]="loading()"
      [emptyLabel]="'Sin cargos'"
    ></app-kpi-card>
  </div>
</div>

<app-generic-table
  [title]="'Listado de Cargos'"
  [columns]="tableColumns"
  [readonlyFields]="['id_cargo']"
  [data]="cargosList"
  [showActions]="true"
  [requiredFields]="['cargo']"
  [allowedActions]="['edit']"
  [searchEnabled]="true"
  [showNewRegister]="true"
  [entityDTO]="cargoDTO"
  (edit)="onEditCargo($event)"
  (new)="onAddCargo($event)"
  (delete)="onDeleteCargo($event)"
>
</app-generic-table>
