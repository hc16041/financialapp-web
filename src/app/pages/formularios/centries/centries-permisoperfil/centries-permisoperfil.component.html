<!-- KPIs de Permisos por Perfil (SPEC-06 §4.6) -->
<div class="row g-3 mb-3">
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Total asignaciones"
      [value]="totalAsignaciones()"
      icon="mdi mdi-key-outline"
      variant="primary"
      [loading]="loading()"
      [emptyLabel]="'Sin asignaciones'"
    ></app-kpi-card>
  </div>
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Perfiles"
      [value]="perfilesAsignados()"
      icon="mdi mdi-account-group-outline"
      variant="info"
      [loading]="loading()"
      [emptyLabel]="'Sin asignaciones'"
    ></app-kpi-card>
  </div>
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Permisos"
      [value]="permisosAsignados()"
      icon="mdi mdi-shield-key-outline"
      variant="success"
      [loading]="loading()"
      [emptyLabel]="'Sin asignaciones'"
    ></app-kpi-card>
  </div>
</div>

<app-generic-table
  [title]="'Listado de Permisos por Perfil'"
  [columns]="tableColumns"
  [excludedFields]="['nombre_permiso', 'perfil']"
  [selectFields]="['id_perfil', 'id_permiso']"
  [requiredFields]="['id_perfil', 'id_permiso']"
  [allowedActions]="['delete']"
  [data]="permisosPerfilList"
  [showActions]="true"
  [searchEnabled]="true"
  [showNewRegister]="true"
  [entityDTO]="permisoperfilDTO"
  [hiddenColumns]="['id_perfil', 'id_permiso']"
  [selectOptions]="selectOptions"
  (profileSelected)="handleProfileChange($event)"
  (new)="onAddPermisoPerfil($event)"
  (delete)="onDeletePermisoPerfil($event)"
>
</app-generic-table>
