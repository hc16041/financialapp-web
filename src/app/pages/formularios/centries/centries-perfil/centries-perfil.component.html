<!-- KPIs de Perfiles (SPEC-06 §4.6) -->
<div class="row g-3 mb-3">
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Total perfiles"
      [value]="totalPerfiles()"
      icon="mdi mdi-account-group-outline"
      variant="primary"
      [loading]="loading()"
      [emptyLabel]="'Sin perfiles'"
    ></app-kpi-card>
  </div>
</div>

<app-generic-table
  [title]="'Listado de Perfiles'"
  [columns]="tableColumns"
  [readonlyFields]="['id_perfil']"
  [data]="perfilesList"
  [showActions]="true"
  [allowedActions]="['edit']"
  [searchEnabled]="true"
  [showNewRegister]="true"
  [entityDTO]="perfilDTO"
  (edit)="onEditPerfil($event)"
  (new)="onAddPerfil($event)"
  (delete)="onDeletePerfil($event)"
>
</app-generic-table>
