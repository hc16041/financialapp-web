<!-- KPIs de Tarjetas de Crédito (SPEC-06 §4.2): consumen GET api/CreditCards/summary -->
<div class="row g-3 mb-3">
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Límite total"
      [value]="totalLimit()"
      icon="mdi mdi-credit-card-outline"
      variant="primary"
      [isCurrency]="true"
      [loading]="loading()"
      [emptyLabel]="'Sin tarjetas'"
    ></app-kpi-card>
  </div>
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Saldo usado"
      [value]="usedBalance()"
      icon="mdi mdi-cash-remove"
      variant="danger"
      [isCurrency]="true"
      [loading]="loading()"
      [emptyLabel]="'Sin tarjetas'"
    ></app-kpi-card>
  </div>
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Crédito disponible"
      [value]="availableCredit()"
      icon="mdi mdi-cash-check"
      variant="success"
      [isCurrency]="true"
      [loading]="loading()"
      [emptyLabel]="'Sin tarjetas'"
    ></app-kpi-card>
  </div>
</div>

<app-generic-table
  [title]="'Listado de Tarjetas de Crédito'"
  [columns]="tableColumns"
  [sumColumns]="['creditLimit', 'currentBalance', 'availableCredit']"
  [excludedFields]="[
    'fecha_creacion',
    'fecha_actualizacion',
    'cod_usuario',
    'cod_usuario_modificacion',
    'isActive'
  ]"
  [requiredFields]="['id']"
  [readonlyFields]="['id']"
  [allowedActions]="['edit', 'deactivate', 'activate']"
  [data]="creditcardList"
  [showActions]="true"
  [searchEnabled]="true"
  [showNewRegister]="true"
  [showStatusFilter]="true"
  [entityDTO]="creditcardDTO"
  [hiddenColumns]="[
    'id',
    'fecha_creacion',
    'fecha_actualizacion',
    'cod_usuario',
    'cod_usuario_modificacion',
    'isActive'
  ]"
  [selectOptions]="selectOptions"
  (new)="onAddCreditcard($event)"
>
</app-generic-table>
