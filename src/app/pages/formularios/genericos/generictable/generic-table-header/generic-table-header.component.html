<div class="card-header">
  <!-- Primera fila: Título y botones principales -->
  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3"
  >
    <h4 class="card-title mb-0">{{ title }}</h4>
    <div class="d-flex flex-wrap gap-2">
      <button
        *ngIf="showNewRegister"
        class="btn btn-outline-info btn-sm waves-effect waves-light"
        (click)="onNewClick()"
        id="btn_insertar"
      >
        <i class="mdi mdi-plus d-md-none"></i>
        <span class="d-none d-md-inline">Nuevo Registro</span>
        <span class="d-md-none">Nuevo</span>
      </button>
      <button
        *ngIf="showXmlDownload && hasPermission('descargaXml')"
        class="btn btn-outline-warning btn-sm waves-effect waves-light d-none d-md-inline-flex"
        (click)="onXmlDownloadClick()"
        id="btn_descarga_xml"
      >
        <i class="mdi mdi-file-xml me-1"></i>
        Descargar XML
      </button>
      <button
        *ngIf="showExcelDownload && hasPermission('descargaExcel')"
        class="btn btn-outline-success btn-sm waves-effect waves-light d-none d-md-inline-flex"
        (click)="onExcelDownloadClick()"
        id="btn_descarga_excel"
      >
        <i class="mdi mdi-file-excel me-1"></i>
        Descargar Excel
      </button>
      <button
        *ngIf="showTextoDownload && hasPermission('descargaTextoPlano')"
        class="btn btn-outline-secondary btn-sm waves-effect waves-light d-none d-lg-inline-flex"
        (click)="onTextoDownloadClick()"
        id="btn_descarga_texto_plano"
      >
        <i class="mdi mdi-file-delimited me-1"></i>
        Descargar Texto
      </button>
      <button
        *ngIf="showPdfDownload && hasPermission('descargaPdf')"
        class="btn btn-outline-danger btn-sm waves-effect waves-light d-none d-lg-inline-flex"
        (click)="onPdfDownloadClick()"
        id="btn_descarga_pdf"
      >
        <i class="mdi mdi-file-pdf me-1"></i>
        Descargar PDF
      </button>
      <button
        *ngIf="showReporteDownload && hasPermission('descargaExcelPlantilla')"
        class="btn btn-outline-dark btn-sm waves-effect waves-light d-none d-lg-inline-flex"
        (click)="onReporteDownloadClick()"
        id="btn_descarga_excel_plantilla"
      >
        <i class="mdi mdi-file-chart me-1"></i>
        Descargar Reporte
      </button>
      <button
        class="btn btn-outline-info btn-sm waves-effect waves-light"
        (click)="onToggleShowAllClick()"
      >
        <span class="d-none d-md-inline">{{
          showAll ? "Ver menos" : "Ver todo"
        }}</span>
        <span class="d-md-none">{{ showAll ? "Menos" : "Todo" }}</span>
      </button>
    </div>
  </div>

  <!-- Barra de filtros colapsable -->
  @if (hasFilters) {
  <div class="d-flex align-items-center mt-3">
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary filter-toggle-btn"
      (click)="toggleFilters()"
      [attr.aria-expanded]="filtersExpanded"
      aria-controls="genericTableFilterBar"
    >
      <i class="mdi mdi-filter me-1"></i>
      <span>{{
        filtersExpanded ? "Ocultar filtros" : "Mostrar filtros"
      }}</span>
    </button>
  </div>

  <div
    id="genericTableFilterBar"
    class="filter-bar"
    *ngIf="filtersExpanded"
  >
    <div
      class="d-flex flex-column flex-md-row gap-3 align-items-stretch align-items-md-center mt-3"
    >
      <!-- Filtro de estado -->
      <div *ngIf="showStatusFilter" class="w-filter-status">
        <label class="visually-hidden" for="gt-filter-status">Filtrar por estado</label>
        <select
          id="gt-filter-status"
          class="form-select form-select-sm"
          aria-label="Filtrar por estado"
          (change)="onStatusChange($event)"
          [disabled]="!hasData"
        >
          <option
            *ngFor="let opt of statusFilterOptions"
            [value]="opt.value === null ? 'null' : opt.value"
          >
            {{ opt.label }}
          </option>
        </select>
      </div>

      <!-- Filtro de rango de fechas -->
      <div *ngIf="showDateRangeFilter" class="flex-grow-1">
        <div
          class="d-flex flex-column flex-md-row gap-2 align-items-stretch align-items-md-center"
        >
          <label
            class="form-label mb-0 d-none d-md-inline-block me-2 text-nowrap"
          >
            {{ dateRangeLabel }}:
          </label>
          <div class="d-flex gap-2 align-items-center flex-grow-1">
            <label class="visually-hidden" for="gt-date-start">Fecha inicio</label>
            <input
              id="gt-date-start"
              type="date"
              class="form-control form-control-sm"
              [(ngModel)]="startDate"
              placeholder="Fecha inicio"
              aria-label="Fecha inicio del rango"
            />
            <span class="text-muted d-none d-md-inline">-</span>
            <label class="visually-hidden" for="gt-date-end">Fecha fin</label>
            <input
              id="gt-date-end"
              type="date"
              class="form-control form-control-sm"
              [(ngModel)]="endDate"
              placeholder="Fecha fin"
              aria-label="Fecha fin del rango"
            />
            <button
              type="button"
              class="btn btn-primary btn-sm flex-shrink-0"
              (click)="onDateRangeSearchClick()"
              [disabled]="!startDate || !endDate"
            >
              <i class="mdi mdi-magnify me-1"></i>
              <span>Buscar</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Búsqueda -->
      <div *ngIf="searchEnabled" class="w-filter-search">
        <label class="visually-hidden" for="gt-search">Buscar en la tabla</label>
        <input
          id="gt-search"
          type="text"
          class="form-control form-control-sm search"
          placeholder="Buscar..."
          aria-label="Buscar en la tabla"
          (input)="onSearchInput($event)"
        />
      </div>

      <ng-content select="[tableActions]"></ng-content>
    </div>
  </div>
  }
</div>
