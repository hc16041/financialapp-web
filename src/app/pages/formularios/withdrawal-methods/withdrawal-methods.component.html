<!-- KPIs de Métodos de Retiro (SPEC-06 §4.5): conteos desde la lista cargada -->
<div class="row g-3 mb-3">
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Total métodos"
      [value]="totalMethods()"
      icon="mdi mdi-bank-transfer-out"
      variant="primary"
      [loading]="loading()"
      [emptyLabel]="'Sin métodos de retiro'"
    ></app-kpi-card>
  </div>
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Activos"
      [value]="activeMethods()"
      icon="mdi mdi-check-circle-outline"
      variant="success"
      [loading]="loading()"
      [emptyLabel]="'Sin métodos de retiro'"
    ></app-kpi-card>
  </div>
  <div class="col-sm-6 col-xl-4">
    <app-kpi-card
      label="Inactivos"
      [value]="inactiveMethods()"
      icon="mdi mdi-close-circle-outline"
      variant="danger"
      [loading]="loading()"
      [emptyLabel]="'Sin métodos de retiro'"
    ></app-kpi-card>
  </div>
</div>

<app-generic-table
  [title]="'Listado de Métodos de Retiro'"
  [columns]="tableColumns"
  [excludedFields]="[]"
  [selectFields]="[]"
  [requiredFields]="['id']"
  [readonlyFields]="['id']"
  [allowedActions]="['edit', 'delete']"
  [data]="withdrawalMethodsList"
  [showActions]="true"
  [searchEnabled]="true"
  [showNewRegister]="true"
  [showStatusFilter]="true"
  [entityDTO]="withdrawalMethodsDTO"
  [hiddenColumns]="['id']"
  (new)="onAddWithdrawalMethod($event)"
  (edit)="onEditWithdrawalMethod($event)"
  (delete)="onDeleteWithdrawalMethod($event)"
>
</app-generic-table>
